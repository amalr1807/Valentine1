<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Achu ❤️</title>
  <style>
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
    }
    .card {
      background: white;
      padding: 34px 40px;
      border-radius: 26px;
      text-align: center;
      box-shadow: 0 28px 60px rgba(0,0,0,0.18);
      max-width: 380px;
      animation: pop 0.8s ease;
    }
    @keyframes pop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    h1 { color: #ff4d6d; margin-bottom: 10px; }
    h2 { color: #ff4d6d; }
    p {
      color: #555;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 18px;
      position: relative;
    }
    button {
      padding: 12px 28px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    #yes {
      background: #ff4d6d;
      color: white;
      box-shadow: 0 12px 22px rgba(255,77,109,0.45);
    }
    #yes:hover { transform: scale(1.15); }
    #no {
      background: #eee;
      color: #333;
      position: absolute;
    }
    .countdown {
      font-size: 28px;
      color: #ff4d6d;
      margin: 18px 0;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    .heart {
      position: absolute;
      color: #ff4d6d;
      animation: float 4s linear infinite;
    }
    @keyframes float {
      from { transform: translateY(100vh); opacity: 1; }
      to { transform: translateY(-10vh); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>Achu 💖</h1>
    <p>
      Every heartbeat of mine seems to whisper your name.
      You turned my world softer, brighter, and full of meaning.
    </p>
    <p>This moment matters to me more than you know…</p><div class="countdown" id="countdown">3</div>

<h2>Will you be my Valentine?</h2>
<div class="buttons" style="margin-top:18px; height:60px;">
  <button id="yes">Yes ❤️</button>
  <button id="no">No 🙈</button>
</div>

  </div>  <div class="hearts" id="hearts"></div>  <script>
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');
    const card = document.getElementById('card');
    const hearts = document.getElementById('hearts');
    const countdownEl = document.getElementById('countdown');

    // Countdown animation
    let count = 3;
    const countdownTimer = setInterval(() => {
      count--;
      if (count > 0) {
        countdownEl.textContent = count;
      } else {
        countdownEl.textContent = '💗';
        clearInterval(countdownTimer);
      }
    }, 1000);

    // Extra sneaky No button 😈
    function moveNoButton() {
      const x = Math.random() * 260 - 130;
      const y = Math.random() * 160 - 80;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }
    noBtn.addEventListener('mouseover', moveNoButton);
    noBtn.addEventListener('touchstart', moveNoButton);

    // Yes button magic 💘
    yesBtn.addEventListener('click', () => {
      card.innerHTML = `
        <h1>Achu ❤️</h1>
        <p>
          This isn’t just a Valentine question.
          It’s my heart choosing you — again and again.
        </p>
        <h2>I love you 💖</h2>
        <p>Happy Valentine’s Day, my favorite person.</p>
      `;
      createHearts();
    });

    function createHearts() {
      setInterval(() => {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerText = '❤️';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = Math.random() * 24 + 16 + 'px';
        hearts.appendChild(heart);
        setTimeout(() => heart.remove(), 4000);
      }, 150);
    }
  </script></body>
</html>
